<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Metadata Extractor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖼️ Image Metadata Extractor</h1>
            <p>Photo se chhupi hui information nikalo — camera, GPS, date, settings</p>
        </header>

        <div class="upload-box" id="uploadBox">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <div class="upload-content">
                <div class="icon">📁</div>
                <p><strong>Click karo</strong> ya image drag karo</p>
                <p class="small">JPG, JPEG, PNG, TIFF supported</p>
            </div>
        </div>

        <div class="preview" id="preview" style="display:none;">
            <img id="previewImg" alt="preview">
        </div>

        <div class="results" id="results" style="display:none;">
            <h2>📋 Metadata</h2>
            <div id="metadataList"></div>
            <button id="clearBtn" class="secondary">🗑️ Clear</button>
        </div>

        <footer>
            <p>100% browser mein — koi file upload nahi hoti 🔒</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
